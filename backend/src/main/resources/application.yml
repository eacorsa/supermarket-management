spring:
  datasource:
    url: jdbc:mysql://localhost:3306/supermercado?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    jwt:
      secret: ${JWT_SECRET:supermercado-secret-key-change-in-production-min-32-bytes-long}
      expiration: 3600000
      refresh-expiration: 604800000

sales:
  tax-rate: ${SALES_TAX_RATE:0.15}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
